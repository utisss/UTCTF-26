services:
  crypto-oblivious-error:
    build:
      context: .
      args:
        USER: "user"
        FLAG: "utflag{my_obl1v10u5_fr13nd_ru1n3d_my_c0de}"
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 1g
        max-file: "1"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "echo | socat - TCP:localhost:9000,connect-timeout=2"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - 8379:9000
    read_only: true
